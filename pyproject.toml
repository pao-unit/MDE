[project]
name            = "dimx"
description     = "Manifold Dimensional Expansion"
dynamic         = ["version","versionDate"]
readme          = "README.md"
license         = "LicenseRef-OIST-License"
license-files   = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyEDM>=2.5.6",
    "matplotlib",
    "numpy",
    "pandas>=2.0",
    "pydiffmap>=0.2.0.1",
    "scikit-learn",
    "scipy",
]
authors = [
  { name = "Joseph Park",     email = "JosephPark@IEEE.org"     },
  { name = "Gerald Pao",      email = "Gerald.Pao@OIST.jp"      },
  { name = "Temma Fujishige", email = "Temma.Fujishige@OIST.jp" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
[project.urls]
Homepage      = "https://github.com/pao-unit/MDE"
Documentation = "https://pao-unit.github.io/MDE_docs/"
Issues        = "https://github.com/pao-unit/MDE/issues"
[project.optional-dependencies]
test = [
    "pyarrow",
    "pytest>=8",
    "pytest-timeout>=2.3",
]
[tool.pdm.version]
source = "file"
path   = "dimx/__init__.py"
[tool.pdm.build]
source-includes = ["ci/", "tests/"]
[build-system]
requires      = ["pdm-backend"]
build-backend = "pdm.backend"
