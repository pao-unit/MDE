name: Extended validation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: ${{ github.workspace }}/.ci/matplotlib
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  VALIDATION_REF: bae270e568dd52830f57ab661380e700097aa58d

jobs:
  external-pyedm:
    name: External pyEDM validation (31 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pao-unit/EDM_MDE_validation
          ref: ${{ env.VALIDATION_REF }}
          path: external/EDM_MDE_validation
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dimx and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
      - name: Run every external pyEDM test
        run: |
          mkdir -p "$MPLCONFIGDIR" test-results
          python -m pytest -q \
            -p ci.external_validation_adapter \
            external/EDM_MDE_validation/test_Simplex.py \
            external/EDM_MDE_validation/test_SMap.py \
            external/EDM_MDE_validation/test_CCM.py \
            external/EDM_MDE_validation/test_EDim.py \
            --timeout=600 \
            --durations=33 \
            --junitxml=test-results/external-pyedm.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: external-pyedm-results
          path: test-results/*.xml
          if-no-files-found: error

  external-mde:
    name: External MDE validation (2 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pao-unit/EDM_MDE_validation
          ref: ${{ env.VALIDATION_REF }}
          path: external/EDM_MDE_validation
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dimx and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
      - name: Run both external MDE tests with the documented adapter
        run: |
          mkdir -p "$MPLCONFIGDIR" test-results
          python -m pytest -q \
            -p ci.external_validation_adapter \
            external/EDM_MDE_validation/test_MDE.py \
            --timeout=1800 \
            --durations=2 \
            --junitxml=test-results/external-mde.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: external-mde-results
          path: test-results/*.xml
          if-no-files-found: error
